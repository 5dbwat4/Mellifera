# Mellifera web: Vue frontend (fe/dist) + reverse proxy to Express backend
#
# Backend (node) listens on 127.0.0.1:9000; this site is loopback-only on
# purpose — the app has no auth and can trigger GPU ASR jobs, so it must not
# be directly reachable from the network. Access via ssh tunnel:
#   ssh -L 8080:127.0.0.1:8080 qwen38
# then open http://localhost:8080

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name localhost;

    root /opt/5db-proj/mellifera/fe/dist;
    index index.html;

    # vue-router uses history mode: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Express mounts all routes under /api; no URI on proxy_pass keeps /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # transcript jobs are long-running (ASR can take ~30 min per lecture)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
