# Mellifera nginx snippet — paste into the server { } block of
# /etc/nginx/sites-available/localhost-8123 (the shared entry for all
# projects on qwen38). Active copy lives on the server; this file is the
# version-controlled source. Reload with: nginx -t && nginx -s reload
#
# Frontend is built with vite base '/mellifera/' (fe/vite.config.ts), so
# dist assets and vue-router URLs all live under /mellifera/. The Express
# backend (127.0.0.1:9000) keeps its own /api prefix.

# /mellifera -> /mellifera/
location = /mellifera {
    return 301 /mellifera/;
}

location /mellifera/ {
    alias /opt/5db-proj/mellifera/fe/dist/;
    index index.html;
    # vue-router history mode: unknown paths fall back to the SPA entry
    try_files $uri $uri/ /mellifera/index.html;
}

# proxy_pass with a URI (/api/) strips the /mellifera prefix before
# forwarding, so Express keeps seeing /api/...
location /mellifera/api/ {
    proxy_pass http://127.0.0.1:9000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # transcript jobs are long-running (ASR can take ~30 min per lecture)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
